[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentax"
version = "0.1.0"
description = "How many more tokens do Indian languages cost than English? Measured across real LLM tokenizers on FLORES-200."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Naman Verma" }]
keywords = ["tokenizer", "llm", "multilingual", "indic", "nlp", "fairness"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "tiktoken>=0.7",
    "tokenizers>=0.19",
    "transformers>=4.40",
    "huggingface_hub>=0.23",
    "indic-transliteration>=2.3",
]

[project.optional-dependencies]
bench = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=8", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
tokentax = "tokentax.cli:main"

[project.urls]
Homepage = "https://naman-verma-02.github.io/tokentax/"
Source = "https://github.com/NAMAN-VERMA-02/tokentax"

[tool.setuptools]
packages = ["tokentax"]
